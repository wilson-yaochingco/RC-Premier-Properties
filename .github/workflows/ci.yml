name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test, build, browser acceptance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # One install at the root covers the shared, backend and frontend workspaces.
      # The postinstall hook builds @rc/shared, which the other two compile against.
      - run: npm ci

      - name: Validate dependency topology
        run: npm ls --all

      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # This verifies optimized artifacts without claiming a live deployment.
          # Staging/production use their real HTTPS origins and provider configuration.
          NEXT_PUBLIC_DEPLOYMENT_ENV: test
          NEXT_PUBLIC_API_URL: https://api.ci.example.test
          NEXT_PUBLIC_SITE_URL: https://site.ci.example.test

      - name: Strict staging-shaped deployment build
        run: npm run build:deployment
        env:
          NEXT_PUBLIC_DEPLOYMENT_ENV: staging
          NEXT_PUBLIC_API_URL: https://api.ci.example.test
          NEXT_PUBLIC_SITE_URL: https://site.ci.example.test
          NEXT_PUBLIC_MEDIA_ORIGIN: https://media.ci.example.test
          NEXT_PUBLIC_MAP_TILE_URL: https://tiles.ci.example.test/{z}/{x}/{y}.png
          NEXT_PUBLIC_MAP_ATTRIBUTION_TEXT: CI map fixture
          NEXT_PUBLIC_MAP_ATTRIBUTION_URL: https://tiles.ci.example.test/attribution

      - name: Browser acceptance tests
        run: npm run test:e2e
